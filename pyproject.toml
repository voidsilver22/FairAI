[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairlens-backend"
version = "0.1.0"
description = "Production-minded FairLens ATS Pipeline backend built with FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "starlette>=0.40.0,<0.47.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "pandas>=2.2.0,<3.0.0",
  "numpy>=2.0.0,<3.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
]
gcp = [
  "google-cloud-storage>=2.17.0,<3.0.0",
  "google-cloud-aiplatform>=1.61.0,<2.0.0",
  "google-cloud-pubsub>=2.22.0,<3.0.0",
]
ml = [
  "joblib>=1.4.0,<2.0.0",
  "torch>=2.3.0,<3.0.0",
  "spacy>=3.7.0,<4.0.0",
  "sentence-transformers>=3.0.0,<4.0.0",
  "scikit-learn>=1.5.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
